<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>MVST LinkedIn Q4 Plan</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--blue:#1D2BEE;--bg:#F5F3EE;--ink:#141414;--quiet:#6B6862;--line:#E2DED5;--card:#FFFFFF}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 "Instrument Sans",system-ui,sans-serif;
 background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:48px 48px;background-attachment:fixed}
h1,h2,h3,h4{font-family:"Bricolage Grotesque",sans-serif;letter-spacing:-.01em;margin:0}
#app{max-width:880px;margin:0 auto;padding:0 16px 64px}
.hero{padding:72px 0 28px}
.eyebrow{margin:0 0 8px;color:var(--blue);font-weight:600;text-transform:uppercase;letter-spacing:.08em;font-size:13px}
.hero h1{font-size:clamp(40px,8vw,72px);line-height:1;font-weight:700}
.meta{color:var(--quiet);margin:14px 0 0}
.toc{position:sticky;top:0;z-index:5;display:flex;gap:6px;overflow-x:auto;padding:12px 0;background:var(--bg);border-bottom:1px solid var(--line);margin-bottom:8px;scrollbar-width:none}
.toc a{flex:none;color:var(--ink);text-decoration:none;font-size:14px;padding:6px 12px;border:1px solid var(--line);border-radius:999px;background:var(--card)}
.toc a:hover{border-color:var(--blue);color:var(--blue)}
section{padding:48px 0 8px;scroll-margin-top:60px}
h2{font-size:clamp(28px,5vw,40px);font-weight:700;margin-bottom:20px;display:flex;align-items:baseline;gap:14px}
h2 span{color:var(--blue);font-size:.5em;font-weight:500}
.lead{font-size:18px;max-width:68ch}
.chart{margin:24px 0;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px 22px 14px}
.chart h3{font-size:20px;font-weight:700}
.chart .sub{color:var(--quiet);margin:4px 0 16px;font-size:14px}
.chart svg{width:100%;height:auto;display:block}
.chart figcaption{color:var(--quiet);font-size:12px;margin-top:10px;border-top:1px solid var(--line);padding-top:8px}
.facts{list-style:none;padding:0;margin:24px 0;display:grid;gap:10px}
.facts li{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.facts b{display:block;font-family:"Bricolage Grotesque",sans-serif;color:var(--blue);margin-bottom:2px}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:14px;background:var(--card)}
table{border-collapse:collapse;width:100%;min-width:560px;font-size:15px}
th,td{text-align:left;vertical-align:top;padding:12px 16px;border-bottom:1px solid var(--line)}
th{font-family:"Bricolage Grotesque",sans-serif;font-weight:700;background:var(--blue);color:#fff}
tr:last-child td{border-bottom:0}
.steps{padding-left:22px;max-width:70ch}.steps li{margin:8px 0}
.note{color:var(--quiet);border-left:3px solid var(--blue);padding-left:12px}
.flow{display:grid;gap:0;margin:20px 0}
.step{display:flex;gap:16px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px;position:relative;margin-bottom:22px}
.step:not(:last-child)::after{content:"";position:absolute;left:37px;bottom:-23px;width:2px;height:22px;background:#B9B5AB}
.step .n{flex:none;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-family:"Bricolage Grotesque",sans-serif;font-weight:700;border:1.5px solid var(--ink)}
.step.key{border:2px solid var(--blue);background:#EEF0FE}.step.key .n{background:var(--blue);border-color:var(--blue);color:#fff}
.step h4{font-size:18px}.step h4 em{font-style:normal;font-family:"Instrument Sans",system-ui,sans-serif;font-weight:500;color:var(--quiet);font-size:14px;margin-left:6px}
.step p{margin:4px 0 0}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px 20px;margin:8px 0 20px}
.card ol{margin:10px 0 0;padding-left:22px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin:20px 0}.kpis>div{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px}.kpis p{margin:0;font-size:14px;color:var(--quiet)}.kpis b{color:var(--ink)}.kpis .num{font-family:"Bricolage Grotesque",sans-serif;font-size:30px;font-weight:700;color:var(--blue);margin-bottom:6px}
.goals{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}
.goal{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px}
.goal p{margin:0}.goal .who{font-weight:600;color:var(--quiet);font-size:14px}
.goal .num{font-family:"Bricolage Grotesque",sans-serif;font-size:40px;font-weight:700;color:var(--blue);line-height:1.1;margin:6px 0 10px}
.goal .num small{display:block;font-size:13px;color:var(--quiet);font-family:"Instrument Sans",system-ui,sans-serif;font-weight:500}
footer{margin-top:56px;color:var(--quiet);font-size:13px;border-top:1px solid var(--line);padding-top:16px}
#gate{min-height:100vh;display:grid;place-items:center;padding:16px}
.box{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:36px 32px;width:100%;max-width:380px;text-align:center}
.box .logo{font-family:"Bricolage Grotesque",sans-serif;font-weight:700;font-size:30px;color:var(--blue)}
.box p{color:var(--quiet);margin:6px 0 22px}
.box input{width:100%;font:inherit;padding:12px 14px;border:1px solid #CFCBC1;border-radius:10px;background:var(--bg)}
.box input:focus{outline:2px solid var(--blue);border-color:transparent}
.box button{margin-top:12px;width:100%;font:inherit;font-weight:600;padding:12px;border:0;border-radius:10px;background:var(--blue);color:#fff;cursor:pointer}
.err{color:#C0362C;font-size:14px;min-height:20px;margin-top:10px}
@media (max-width:600px){.chart{padding:16px 12px 10px}.hero{padding-top:48px}}
</style></head>
<body>
<div id="gate"><form class="box" id="f">
  <div class="logo">MVST</div>
  <p>LinkedIn Q4 Plan 2026</p>
  <input type="password" id="pw" placeholder="Passwort" autocomplete="current-password" autofocus>
  <button type="submit">Öffnen</button>
  <div class="err" id="err"></div>
</form></div>
<main id="app" hidden></main>
